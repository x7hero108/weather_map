<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="WeatherMap - search any place and see live weather on an interactive map.">
  <title>WeatherMap</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="page-header">
    <h1 class="page-title">WeatherMap</h1>
    <p class="page-subtitle">Search a city, address or landmark to see its live weather on the map.</p>
  </header>

  <main class="page-main">
    <form id="search-form" class="search-form" novalidate>
      <label for="location-input" class="visually-hidden">Location</label>
      <input id="location-input" class="search-input" type="text" name="location"
             placeholder="Enter a location, e.g. Port Sudan" autocomplete="off" required>
      <button id="submit-btn" class="search-btn" type="submit">Get Weather</button>
    </form>

    <div id="favorites" class="favorites" aria-label="Favorite locations"></div>

    <div id="spinner" class="spinner-wrap" role="status" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span>Loading weather data...</span>
    </div>

    <div id="alert" class="alert-card" role="alert" hidden>
      <p id="alert-text" class="alert-text"></p>
      <button id="alert-close" class="alert-close" type="button" aria-label="Dismiss message">&times;</button>
    </div>

    <div id="map" class="map-container" aria-label="Weather map"></div>
  </main>

  <footer class="page-footer">
    Weather: OpenWeatherMap &middot; Geocoding: Nominatim &middot; Map: Leaflet &amp; OpenStreetMap
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
